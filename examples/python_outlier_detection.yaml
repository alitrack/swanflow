# SwanFlow Example: Python Outlier Detection (Zero-Copy, High Performance)
#
# Demonstrates the high-performance Python path for statistical work that a
# chain of SQL steps would handle awkwardly: IQR-based outlier detection on a
# numeric column, computed in-place on the Arrow batch with zero-copy
# exchange (no row-by-row Python loop, no DataFrame materialization, no
# sklearn dependency).
#
# This is the canonical example for the "heavy numeric / stats work ->
# core.script.python" guidance in the analyst agent's system prompt
# (see `docs/` and `crates/swanflow/src/agent/mod.rs` PERFORMANCE section).
#
# Pipeline:  users.csv  ->  core.script.python (IQR flags on `salary`)
# Output:    the same columns plus salary_low / salary_high outlier flags.
#
# Usage:
#   swanflow run examples/python_outlier_detection.yaml

name: "Example: Python IQR Outlier Detection"
description: "Zero-copy IQR outlier detection on a numeric column via core.script.python."
id: "00000000-0000-0000-0006-0000000000ff"
graph:
  nodes:
    - id: "00000000-0000-0000-0006-000000000001"
      type_id: "core.io.csv"
      config: { path: "users.csv" }
      state: "Configured"
    - id: "00000000-0000-0000-0006-000000000002"
      type_id: "core.script.python"
      config:
        # sandboxed by default (no extra imports beyond the pyarrow core).
        script: |
          import pyarrow as pa
          import pyarrow.compute as pc

          # `batch` is the zero-copy Arrow input; expose it as a pyarrow batch.
          pa_batch = pa.record_batch(batch)
          values = pa_batch.column("salary").sort().to_pylist()
          n = len(values)
          # Linear-interpolated quantiles (percentile_cont), no numpy needed.
          def q(p):
              idx = (n - 1) * p
              lo, hi = int(idx), min(int(idx) + 1, n - 1)
              frac = idx - lo
              return values[lo] * (1 - frac) + values[hi] * frac
          q1, q3 = q(0.25), q(0.75)
          iqr = q3 - q1
          lower, upper = q1 - 1.5 * iqr, q3 + 1.5 * iqr

          sal = pa_batch.column("salary")
          keep = [
              pa_batch.column("id"),
              pa_batch.column("name"),
              pa_batch.column("age"),
              pa_batch.column("salary"),
              pa_batch.column("dept"),
              pc.less(sal, pa.scalar(lower, type=sal.type)),
              pc.greater(sal, pa.scalar(upper, type=sal.type)),
          ]
          return pa.RecordBatch.from_arrays(
              keep,
              names=["id", "name", "age", "salary", "dept", "salary_low", "salary_high"],
          )
      state: "Configured"
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
