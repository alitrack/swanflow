[package]
name = "swanflow-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Plugin SDK for SwanFlow — build custom nodes as external crates"
license = "Apache-2.0"
repository = "https://github.com/alitrack/swanflow"

[dependencies]
swanflow-core = { path = "../swanflow-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
datafusion = "52.1.0"
