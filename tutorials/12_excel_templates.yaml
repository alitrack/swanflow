name: "Tutorial 12: Excel Template Filling"
description: "Demonstrates how to inject data into pre-styled Excel templates using markers."
id: "00000000-0000-0000-0012-000000000001"
graph:
  nodes:
    - id: "00000000-0000-0000-0012-000000000002"
      type_id: "core.io.csv"
      config: { path: "users.csv" }
      state: "Configured"
    
    - id: "00000000-0000-0000-0012-000000000003"
      type_id: "core.io.excel_template"
      config:
        template_path: "corporate_template.xlsx"
        output_path: "filled_corporate_report.xlsx"
        sheet: "Executive Dashboard"
        markers:
          "name": "{{UserName}}"
          "salary": "{{UserSalary}}"
        table_start: "A15"
      state: "Configured"

  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
