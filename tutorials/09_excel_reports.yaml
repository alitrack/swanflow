name: "Tutorial 09: Advanced Excel Reports"
description: "Demonstrates reading Excel, cleaning with SQL, and writing back with chart metadata."
id: "00000000-0000-0000-0000-000000000009"
graph:
  nodes:
    - id: "excel_source"
      type_id: "core.io.excel_read"
      config:
        path: "data.xlsx"
        sheet: "Sheet1"
      state: "Configured"
    - id: "cleaner"
      type_id: "core.sql"
      config:
        query: 'SELECT "Name", "Score" FROM input_0'
      state: "Configured"
    - id: "report_generator"
      type_id: "core.io.excel_write"
      config:
        path: "final_report.xlsx"
        sheet: "Analysis"
        charts:
          - type: "column"
            title: "Performance Scores"
      state: "Configured"
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
    - [1, 2, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
