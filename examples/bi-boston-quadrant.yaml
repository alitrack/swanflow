# SwanFlow BI Template: Boston Quadrant Segmentation (bi-clustering, path a)
#
# Ported from QwenPaw-Data skill "atomic/bi-clustering" (Apache-2.0),
# Boston-matrix path (boston_quadrant.py): split two axes at a boundary
# statistic (mean or median) and bucket every object into 4 quadrants.
# SQL version keeps the script semantics:
#   - continuous axis split: mean (default) or median; "low" is <= split
#   - quadrants always reported (empty ones included) in the summary table
#   - BCG labels are given for the classic 增长(y) x 份额(x) framing
#
# Input shape expected from real data (replace node 0's query):
#   object_id | x_metric | y_metric
#
# Usage:
#   swanflow run examples/bi-boston-quadrant.yaml
name: "BI Boston Quadrant"
id: "a0000000-0000-0000-0000-0000000000e0"
graph:
  nodes:
    - id: "a0000000-0000-0000-0000-0000000000e1"
      type_id: "core.io.duckdb_read"
      config:
        path: ":memory:"
        query: |
          -- 10 objects with known quadrants vs the MEAN split
          -- x mean = (10+8+2+1+9+3+7+2+8+10)/10 = 6.0
          -- y mean = (0.3+0.25+0.1+0.05+0.4+0.08+0.2+0.35+0.05+0.5)/10 = 0.228
          SELECT * FROM (VALUES
            ('p1', 10, 0.30), ('p2', 8, 0.25), ('p3', 2, 0.10), ('p4', 1, 0.05),
            ('p5', 9, 0.40), ('p6', 3, 0.08), ('p7', 7, 0.20), ('p8', 2, 0.35),
            ('p9', 8, 0.05), ('p10', 10, 0.50)
          ) t(object_id, x_metric, y_metric)
      state: "Configured"
      sub_workflow: null
    - id: "a0000000-0000-0000-0000-0000000000e2"
      type_id: "core.sql.duckdb"
      config:
        query: |
          WITH splits AS (
            SELECT
              AVG(x_metric) AS x_split,        -- switch to MEDIAN(x_metric) for median split
              AVG(y_metric) AS y_split
            FROM input_0
          ),
          assigned AS (
            SELECT
              o.object_id,
              o.x_metric,
              o.y_metric,
              o.x_metric <= s.x_split AS x_low, -- "low" is <= split (matches script)
              o.y_metric <= s.y_split AS y_low,
              CASE
                WHEN o.x_metric > s.x_split AND o.y_metric > s.y_split THEN 1  -- 明星 star
                WHEN o.x_metric <= s.x_split AND o.y_metric > s.y_split THEN 2 -- 问题 question
                WHEN o.x_metric > s.x_split AND o.y_metric <= s.y_split THEN 3 -- 现金牛 cash cow
                ELSE 4                                                          -- 瘦狗 dog
              END AS quadrant
            FROM input_0 o CROSS JOIN splits s
          )
          SELECT
            object_id, x_metric, y_metric, quadrant,
            CASE quadrant
              WHEN 1 THEN 'Q1 明星(双高)'
              WHEN 2 THEN 'Q2 问题(低x高y)'
              WHEN 3 THEN 'Q3 现金牛(高x低y)'
              ELSE 'Q4 瘦狗(双低)'
            END AS quadrant_name
          FROM assigned
          ORDER BY quadrant, object_id
      state: "Configured"
      sub_workflow: null
    - id: "a0000000-0000-0000-0000-0000000000e3"
      type_id: "core.io.duckdb_write"
      config:
        path: "boston_quadrant.duckdb"
        table: "quadrant_assignment"
      state: "Configured"
      sub_workflow: null
    - id: "a0000000-0000-0000-0000-0000000000e4"
      type_id: "core.sql.duckdb"
      config:
        query: |
          -- Quadrant summary: all four quadrants always appear (empty ones
          -- with zero count), matching the script's always-4-keys JSON.
          SELECT
            q.quadrant,
            CASE q.quadrant
              WHEN 1 THEN 'Q1 明星(双高)'
              WHEN 2 THEN 'Q2 问题(低x高y)'
              WHEN 3 THEN 'Q3 现金牛(高x低y)'
              ELSE 'Q4 瘦狗(双低)'
            END AS quadrant_name,
            COUNT(a.object_id)                                   AS object_count,
            ROUND(COUNT(a.object_id)::DOUBLE / SUM(COUNT(a.object_id)) OVER (), 4) AS share,
            ROUND(AVG(a.x_metric), 4)                            AS avg_x,
            ROUND(AVG(a.y_metric), 4)                            AS avg_y
          FROM (SELECT 1 AS quadrant UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4) q
          LEFT JOIN input_0 a ON TRUE
            AND q.quadrant = CASE
              WHEN a.x_metric > (SELECT AVG(x_metric) FROM input_0)
               AND a.y_metric > (SELECT AVG(y_metric) FROM input_0) THEN 1
              WHEN a.x_metric <= (SELECT AVG(x_metric) FROM input_0)
               AND a.y_metric > (SELECT AVG(y_metric) FROM input_0) THEN 2
              WHEN a.x_metric > (SELECT AVG(x_metric) FROM input_0)
               AND a.y_metric <= (SELECT AVG(y_metric) FROM input_0) THEN 3
              ELSE 4 END
          GROUP BY q.quadrant
          ORDER BY q.quadrant
      state: "Configured"
      sub_workflow: null
    - id: "a0000000-0000-0000-0000-0000000000e5"
      type_id: "core.io.duckdb_write"
      config:
        path: "boston_quadrant.duckdb"
        table: "quadrant_summary"
      state: "Configured"
      sub_workflow: null
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
    - [1, 2, { source_port: 0, target_port: 0 }]
    - [1, 3, { source_port: 0, target_port: 0 }]
    - [3, 4, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
