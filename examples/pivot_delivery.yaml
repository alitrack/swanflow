name: "Pivot Delivery: analysis-layer pivot -> Excel"
description: >
  Demonstrates the agreed pivot delivery form (2026-09-11): core.transform.pivot
  produces a real pivoted table (rows=category, columns=month, values=SUM amount)
  and core.io.excel_write renders it to a real .xlsx.
  Verified e2e: 9 raw rows -> 4-category pivot (beauty/fragrances/furniture/groceries
  x 3 months). The pivot computes its data-dependent output at plan time and
  returns a self-contained scan at run time (no shared-input_0 flakiness).
id: "00000000-0000-0000-0009-000000000010"
graph:
  nodes:
    - id: "00000000-0000-0000-0009-000000000011"
      type_id: "core.io.csv"
      config: { path: "examples/pivot_delivery.csv" }
      state: "Configured"
    - id: "00000000-0000-0000-0009-000000000012"
      type_id: "core.transform.pivot"
      config:
        row: "category"
        column: "month"
        value: "amount"
        aggregator: "sum"
      state: "Configured"
    - id: "00000000-0000-0000-0009-000000000013"
      type_id: "core.io.excel_write"
      config:
        path: "pivot_delivery.xlsx"
        sheet: "Pivot"
      state: "Configured"
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
    - [1, 2, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
