# CI for SwanFlow — Rust-native Data Science DAG Engine
#
# Runs on push/PR to main. Two jobs:
#   1. check — cargo check + clippy + fmt (all three blocking)
#   2. test  — cargo test (needs DuckDB shared library available)
#
# NOTE: Cargo.lock is .gitignored (we're a library, not an application), so the
# lock file is NOT in the repo and `--locked` is deliberately NOT used below.
# This header used to claim "CI uses `cargo check --locked` to verify minimal
# version resolution" — no step ever passed that flag, and with the lock
# untracked it would have failed outright. Corrected in §20 of the spec rather
# than quietly deleted: the resolution here is whatever the runner resolves
# fresh, which is not reproducible build-to-build.
# (Un-gitignore Cargo.lock if you want per-<https://blog.rust-lang.org/2023/08/24/cargo-lock-for-libs.html>
# MSRV guarantees and real --locked verification; that is a separate decision.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Toolchain is pinned, not `stable`. A lint gate that changes behaviour when
# upstream releases a new Rust is a flaky gate: a fresh `stable` can introduce
# lints that no one on the team has seen, turning a green branch red for reasons
# unrelated to the change. The pin is the version the tree is verified clean
# against; bump it deliberately, together with any fixes the bump requires.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_VERSION: "1.100.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          prefix-key: "v1"

      - name: cargo check (lib)
        run: cargo check --lib

      - name: cargo check (full)
        run: cargo check

      - name: hygiene — unwrap/expect check
        run: bash scripts/ci/check-no-unwrap.sh

      # Blocking. This used to end in `|| true` (and a `| head -50` that
      # swallowed the exit code besides), so the step could not fail: 111 lints
      # accumulated behind a green badge. Cleared in 7f8f4b9 and dffc0cf.
      - name: clippy
        run: cargo clippy --lib -- -D warnings

      # Blocking, as of the preceding rustfmt commit. The `|| true` this used to
      # end with made the step report success on a tree with 115 unformatted
      # files — falsified directly: on that tree the bare command exited 1 and
      # `cargo fmt --check || true` exited 0. A verdict that cannot be non-zero
      # is not a verdict.
      #
      # Note for whoever formats next: rustfmt 1.11.0 is NOT idempotent on this
      # tree. `return Err(anyhow!(...))` inside a match arm needs a second pass,
      # so ONE `cargo fmt` leaves a diff behind and this step stays red. Run
      # `cargo fmt --all` until `cargo fmt --all -- --check` is clean (twice is
      # enough here; verified stable across three consecutive runs).
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: cargo doc (no deps)
        run: cargo doc --lib --no-deps

  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          prefix-key: "v1"

      - name: Install DuckDB shared library
        run: |
          # libduckdb-sys auto-downloads official libduckdb.so via DUCKDB_DOWNLOAD_LIB=1
          # Configured in .cargo/config.toml — no manual download needed.

      # `--test-threads=1` is required, not a preference: the suite opens real
      # DuckDB files and shares env vars, and parallel execution produces a
      # reproducible spurious failure in
      # nodes::relational::tests::join_renames_only_the_colliding_column (that
      # test passes alone and in a serial run). Without this the job can fail for
      # a reason unrelated to the change under test.
      - name: cargo test (lib)
        run: cargo test --lib -- --test-threads=1
        timeout-minutes: 10

      - name: cargo test (doc)
        run: cargo test --doc
        timeout-minutes: 10
