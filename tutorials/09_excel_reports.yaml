name: "Tutorial 09: Professional Excel Reports"
description: "Demonstrates multi-sheet reporting with professional styling and automatic charts."
id: "00000000-0000-0000-0009-000000000001"
graph:
  nodes:
    - id: "00000000-0000-0000-0009-000000000002"
      type_id: "core.io.csv"
      config: { path: "users.csv" }
      state: "Configured"
    
    # Summary 1: Average salary by Dept
    - id: "00000000-0000-0000-0009-000000000003"
      type_id: "core.transform.aggregate"
      config:
        groupby: ["dept"]
        aggs: { "avg_salary": "AVG(salary)" }
      state: "Configured"

    # Multi-sheet sink with Chart
    - id: "00000000-0000-0000-0009-000000000005"
      type_id: "core.io.excel_report"
      config:
        path: "executive_summary.xlsx"
        charts:
          - type: "column"
            title: "Average Salary by Department"
            data_range: "Data!$B$2:$B$10"
            label_range: "Data!$A$2:$A$10"
            offset: { "row": 2, "col": 5 }
      state: "Configured"

  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
    - [1, 2, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
