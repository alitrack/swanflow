# SwanFlow Example: Ossie semantic export pipeline — deterministic stages
# (no LLM required). Same as ossie-semantic-pipeline.yaml minus the
# core.semantic.annotate stage; annotate is LLM-gated and covered by
# mock-provider unit tests.
#
#   Stage 1 (fk-infer):  deterministic join-path probe
#   Stage 2 (export):    catalog + relationships -> Apache Ossie 0.2.x model
#   Stage 3 (read-back): model -> ossie_catalog, SQL-JOINable
#
# Usage:
#   swanflow run examples/ossie-export-pipeline.yaml
name: "Ossie Export Pipeline"
id: "c0000000-0000-0000-0000-0000000000c1"
graph:
  nodes:
    - id: "c0000000-0000-0000-0000-0000000000d1"
      type_id: "core.semantic.fk_infer"
      config:
        database: "/tmp/ossie_rt/demo.duckdb"
        min_match_ratio: 0.9
      state: "Configured"
      sub_workflow: null

    - id: "c0000000-0000-0000-0000-0000000000d2"
      type_id: "core.io.ossie_export"
      config:
        database: "/tmp/ossie_rt/demo.duckdb"
        path: "/tmp/ossie_rt/pipeline_det.ossie.json"
        model_name: "swanflow_pipeline_deterministic"
        infer_relationships: true
      state: "Configured"
      sub_workflow: null

    - id: "c0000000-0000-0000-0000-0000000000d3"
      type_id: "core.io.ossie_read"
      config:
        path: "/tmp/ossie_rt/pipeline_det.ossie.json"
      state: "Configured"
      sub_workflow: null
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
    - [1, 2, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
