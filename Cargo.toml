[package]
name = "rustflow"
version = "0.1.0"
edition = "2021"

[dependencies]
datafusion = "45.0"
arrow = "54.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
petgraph = { version = "0.7", features = ["serde-1"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml-rust2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
