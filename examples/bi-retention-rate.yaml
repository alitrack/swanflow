# SwanFlow BI Template: Retention Analysis (bi-retention-rate)
#
# Ported from QwenPaw-Data skill "atomic/bi-retention-rate" (Apache-2.0).
# The script only divides two aggregates; the skill's own fallback defines the
# real metric — |{day0 new users ∧ active on dayN}| / |{day0 new users}| —
# so this template computes event-level cohort retention in one SQL node:
# cohort date, cohort size, D1/D3/D7 active users and retention rates
# (5 decimal places, matching the original round(5)).
#
# Input shape expected from real data (replace node 0's query):
#   user_id | active_date        (one row per user per active day)
#
# Usage:
#   swanflow run examples/bi-retention-rate.yaml
name: "BI Retention Analysis"
id: "a0000000-0000-0000-0000-0000000000b0"
graph:
  nodes:
    - id: "a0000000-0000-0000-0000-0000000000b1"
      type_id: "core.io.duckdb_read"
      config:
        path: ":memory:"
        query: |
          -- Synthetic event log: two cohorts with known retention
          -- 2026-01-01 cohort: 100 users, 40 back on D1, 20 on D3, 10 on D7
          SELECT 'u' || LPAD(i::VARCHAR, 4, '0') AS user_id, DATE '2026-01-01' AS active_date FROM generate_series(1, 100) t(i)
          UNION ALL SELECT 'u' || LPAD(i::VARCHAR, 4, '0'), DATE '2026-01-02' FROM generate_series(1, 40) t(i)
          UNION ALL SELECT 'u' || LPAD(i::VARCHAR, 4, '0'), DATE '2026-01-04' FROM generate_series(1, 20) t(i)
          UNION ALL SELECT 'u' || LPAD(i::VARCHAR, 4, '0'), DATE '2026-01-08' FROM generate_series(1, 10) t(i)
          -- 2026-01-02 cohort: 50 users, 25 back on D1, 5 on D3, 0 on D7
          UNION ALL SELECT 'v' || LPAD(i::VARCHAR, 4, '0'), DATE '2026-01-02' FROM generate_series(1, 50) t(i)
          UNION ALL SELECT 'v' || LPAD(i::VARCHAR, 4, '0'), DATE '2026-01-03' FROM generate_series(1, 25) t(i)
          UNION ALL SELECT 'v' || LPAD(i::VARCHAR, 4, '0'), DATE '2026-01-05' FROM generate_series(1, 5) t(i)
      state: "Configured"
      sub_workflow: null
    - id: "a0000000-0000-0000-0000-0000000000b2"
      type_id: "core.sql.duckdb"
      config:
        query: |
          WITH first_seen AS (
            SELECT user_id, MIN(active_date) AS cohort_date
            FROM input_0 GROUP BY user_id
          ),
          cohort_sizes AS (
            SELECT cohort_date, COUNT(*) AS cohort_size
            FROM first_seen GROUP BY cohort_date
          ),
          actives AS (
            SELECT f.cohort_date,
                   e.active_date - f.cohort_date AS day_offset,
                   COUNT(DISTINCT e.user_id) AS active_users
            FROM input_0 e
            JOIN first_seen f USING (user_id)
            GROUP BY 1, 2
          )
          SELECT
            c.cohort_date,
            c.cohort_size,
            COALESCE(MAX(CASE WHEN a.day_offset = 1 THEN a.active_users END), 0) AS d1_users,
            ROUND(COALESCE(MAX(CASE WHEN a.day_offset = 1 THEN a.active_users END), 0)::DOUBLE
                  / c.cohort_size, 5) AS d1_retention,
            COALESCE(MAX(CASE WHEN a.day_offset = 3 THEN a.active_users END), 0) AS d3_users,
            ROUND(COALESCE(MAX(CASE WHEN a.day_offset = 3 THEN a.active_users END), 0)::DOUBLE
                  / c.cohort_size, 5) AS d3_retention,
            COALESCE(MAX(CASE WHEN a.day_offset = 7 THEN a.active_users END), 0) AS d7_users,
            ROUND(COALESCE(MAX(CASE WHEN a.day_offset = 7 THEN a.active_users END), 0)::DOUBLE
                  / c.cohort_size, 5) AS d7_retention
          FROM cohort_sizes c
          LEFT JOIN actives a
            ON a.cohort_date = c.cohort_date AND a.day_offset IN (1, 3, 7)
          GROUP BY c.cohort_date, c.cohort_size
          ORDER BY c.cohort_date
      state: "Configured"
      sub_workflow: null
    - id: "a0000000-0000-0000-0000-0000000000b3"
      type_id: "core.io.duckdb_write"
      config:
        path: "retention_analysis.duckdb"
        table: "retention_result"
      state: "Configured"
      sub_workflow: null
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
    - [1, 2, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
