[package]
name = "swanflow-ai"
version = "0.1.0"
edition = "2021"
description = "Optional AI enhancement crate for SwanFlow — ModelRouter, IntelligenceHook, PromptBuilder"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-recursion = "1.1.1"

# Core types from swanflow-core
swanflow-core = { path = "../swanflow-core" }

[dev-dependencies]
tempfile = "3.26.0"
