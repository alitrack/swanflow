# SwanFlow Example: AI Analyst Agent
#
# A SwanFlow DAG that uses AI to analyze data, detect anomalies,
# and produce a report — all while staying deterministically
# scheduled and auditable via the DAG engine.
#
# The AI Agent node has read-only access to the data stream;
# it cannot write to the database or external systems without
# explicit permission (read-XOR-write model).
#
# Usage:
#   swanflow run examples/agent-analyst.yaml

workflow: agent-analyst
version: v1
description: "AI data analyst with deterministic DAG scheduling"

nodes:
  - id: data
    type: duckdb_source
    config:
      query: "SELECT * FROM 'sales_2026.parquet'"
      materialize: true

  - id: profile
    type: sql_transform
    inputs: [data]
    config:
      sql: |
        SELECT
          COUNT(*) AS row_count,
          COUNT(DISTINCT product_id) AS products,
          MIN(sale_date) AS first_sale,
          MAX(sale_date) AS last_sale,
          ROUND(AVG(amount), 2) AS avg_amount
        FROM input

  - id: analyst
    type: ai_agent
    inputs: [profile, data]
    config:
      mode: "read-only"          # Agent can only read data, not write
      prompt: >
        Analyze the sales data. Identify:
        1. Any significant anomalies or outliers
        2. Monthly trends
        3. Top-performing products
        Return structured JSON with findings.
      model: "ollama/llama3.1"

  - id: report
    type: sql_transform
    inputs: [analyst]
    config:
      sql: "SELECT * FROM input"
