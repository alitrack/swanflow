name: "Tutorial 10: Dynamic Parameterization"
description: "Shows how to use global variables and templates to control workflow logic."
id: "00000000-0000-0000-0010-000000000001"
context:
  min_salary: 4000
  target_dept: "IT"
graph:
  nodes:
    - id: "00000000-0000-0000-0010-000000000002"
      type_id: "core.io.csv"
      config: { path: "users.csv" }
      state: "Configured"
    - id: "00000000-0000-0000-0010-000000000003"
      type_id: "core.transform.filter"
      config:
        # Use template to inject global context variable
        expr: "salary > ${context.min_salary} AND dept = '${context.target_dept}'"
      state: "Configured"
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
