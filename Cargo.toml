[package]
name = "rustflow"
version = "0.1.0"
edition = "2021"

[dependencies]
datafusion = "45.0"
arrow = { version = "54.0", features = ["ffi", "pyarrow"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
petgraph = { version = "0.7", features = ["serde-1"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml-rust2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-recursion = "1.1.1"
pyo3 = { version = "0.23", features = ["extension-module"] }
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
schemars = "1.2.1"
serde_yaml = "0.9.34"
clap = { version = "4.5.60", features = ["derive"] }
sha2 = "0.10.9"
pyo3-arrow = "0.7"
parquet = { version = "54.0", features = ["arrow"] }
calamine = "0.33.0"
rust_xlsxwriter = "0.93.0"
duckdb = { version = "1.4.4", features = ["bundled"] }
