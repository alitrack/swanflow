name: "Tutorial 13: Lakehouse SQL Interop"
description: "Demonstrates SQL table handoff across nodes with explicit execution ordering."
id: "00000000-0000-0000-0013-000000000001"
graph:
  nodes:
    # Producer Path
    - id: "a1a1a1a1-0000-0000-0013-000000000002"
      type_id: "core.sql"
      config:
        query: "SELECT 'Electronics' as category, 5000 as revenue UNION ALL SELECT 'Books', 2000"
      state: "Configured"
      materialize: true # This creates 'node_a1a1a1a1'

    # Consumer Path
    - id: "b2b2b2b2-0000-0000-0013-000000000003"
      type_id: "core.sql"
      config:
        # Reference the producer by its short ID prefix
        query: "SELECT * FROM node_a1a1a1a1 WHERE revenue > 3000"
      state: "Configured"
      materialize: false

    # Output for verification
    - id: "c3c3c3c3-0000-0000-0013-000000000004"
      type_id: "core.output"
      config: {}
      state: "Configured"

  edges:
    - [0, 1, { source_port: 0, target_port: 0 }] # Node 1 -> Node 2
    - [1, 2, { source_port: 0, target_port: 0 }] # Node 2 -> Node 3
  node_holes: []
  edge_property: "directed"
