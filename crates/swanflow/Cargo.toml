[package]
name = "swanflow"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Rust-native Data Science DAG Engine — WASM UDF · AI Agent · DBX-Compatible Connectors"
license = "Apache-2.0"
repository = "https://github.com/alitrack/swanflow"
homepage = "https://github.com/alitrack/swanflow"
keywords = ["datafusion", "arrow", "workflow", "etl", "data-science", "wasm"]
categories = ["database", "science", "wasm"]

[lib]
name = "swanflow"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "swanflow"
path = "src/main.rs"
test = false

[[bin]]
name = "swanflow-adapter"
path = "src/bin/swanflow-adapter.rs"
test = false

[dependencies]
swanflow-core = { path = "../swanflow-core" }
swanflow-knime = { path = "../swanflow-knime" }
swanflow-plugin-sdk = { path = "../swanflow-plugin-sdk" }
datafusion = "52.1.0"
arrow = { version = "57.0", features = ["ffi", "pyarrow"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
petgraph = { version = "0.7", features = ["serde-1"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml-rust2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-recursion = "1.1.1"
pyo3 = { version = "0.26.0", features = ["auto-initialize", "multiple-pymethods"] }
reqwest = { version = "0.13.2", features = ["json", "rustls", "blocking"] }
schemars = "1.2.1"
serde_yaml = "0.9.34"
regex = "1.10"
clap = { version = "4.5.60", features = ["derive"] }
sha2 = "0.10.9"
pyo3-arrow = "0.14"
parquet = { version = "57.0", features = ["arrow"] }
calamine = "0.33.0"
rust_xlsxwriter = "0.93.0"
duckdb = { version = "1.10506", features = ["bundled"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono", "rust_decimal", "rustls", "tokio-util"] }
mongodb = "3.2.5"
bson = { version = "2", features = ["chrono-0_4"] }
wasmtime = "28.0.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
lazy_static = "1.5.0"
hex = "0.4"
redis = "0.24"
tokio-util = { version = "0.7.18", features = ["codec", "compat"] }
swanflow-ai = { path = "../swanflow-ai", optional = true }

[features]
default = []
extended-connectors = []
ai = ["swanflow-ai"]

[dev-dependencies]
tempfile = "3.26.0"
