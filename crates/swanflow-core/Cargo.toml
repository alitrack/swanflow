[package]
name = "swanflow-core"
version = "0.1.0"
edition = "2021"
description = "SwanFlow core types: graph, node traits, error types, kernel abstractions"
license = "Apache-2.0"
repository = "https://github.com/alitrack/swanflow"

[dependencies]
datafusion = "52.1.0"
arrow = { version = "57.0", features = ["ffi"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
petgraph = { version = "0.7", features = ["serde-1"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
jsonschema = "0.49.9"
