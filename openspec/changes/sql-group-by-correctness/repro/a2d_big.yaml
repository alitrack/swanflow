# A2 shape 4 — scale: 1000 rows, 50 distinct string keys (20 rows per key),
# generated in DuckDB SQL. Rules out "the 6-row sample is too small to
# expose the collapse".
#
#   duckdb_read (:memory:, range(1000) → 50 keys)
#     -> core.sql (GROUP BY cat)
#     -> duckdb_write (repro_out.duckdb / groupby_out)
#
# Expected healthy: 50 groups, each n=20, total 1000.
# Collapse signatures: 1 row (single NULL/empty key, n=1000) or 0 rows,
# or a wrong-but-plausible group count.
#
# Run:
#   swanflow run --legacy-yaml repro/a2d_big.yaml
#   duckdb repro_out.duckdb "SELECT count(*) AS groups, sum(n) AS total, min(n) AS min_n, max(n) AS max_n FROM groupby_out"
#   -- healthy: groups=50 total=1000 min_n=20 max_n=20
name: "A2d big groupby 1000x50"
id: "b2000000-0000-0000-0000-0000000000d2"
graph:
  nodes:
    - id: "b2000000-0000-0000-0000-000000000001"
      type_id: "core.io.duckdb_read"
      config:
        path: ":memory:"
        query: |
          SELECT 'cat_' || (i % 50) AS cat, i AS v
          FROM range(1000) t(i)
      state: "Configured"
      sub_workflow: null
    - id: "b2000000-0000-0000-0000-000000000002"
      type_id: "core.sql"
      config:
        query: "SELECT cat, count(*) AS n FROM input_0 GROUP BY cat ORDER BY cat"
      state: "Configured"
      sub_workflow: null
    - id: "b2000000-0000-0000-0000-000000000003"
      type_id: "core.io.duckdb_write"
      config:
        path: "repro_out.duckdb"
        table: "groupby_out"
        mode: "replace"
      state: "Configured"
      sub_workflow: null
  edges:
    - [0, 1, { source_port: 0, target_port: 0 }]
    - [1, 2, { source_port: 0, target_port: 0 }]
  node_holes: []
  edge_property: "directed"
